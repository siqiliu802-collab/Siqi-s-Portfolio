<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>摄影 — Siqi's Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&amp;family=Noto+Serif+SC:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#F9F7F9;--paper:#fff;--ink:#111;--mute:#6B6670;--line:#DAD6DC;--placeholder:#ECE9EE;box-sizing:border-box}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:'Noto Serif SC',serif}.mono{font:11px 'DM Mono',monospace;letter-spacing:.1em}
.page{width:min(1280px,92vw);margin:0 auto;padding:24px 0 104px}.nav{display:flex;justify-content:space-between;align-items:center;min-height:38px}.nav a{color:var(--ink);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:3px}.nav span{color:var(--mute)}
.project-footer{padding-top:48px}.bottom-back{display:inline-block;color:var(--ink);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:3px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:clamp(54px,8vh,88px) 0 2px}.page-head h1{width:min(760px,70vw);margin:0;line-height:0}.page-head h1 img{display:block;width:100%;height:auto;mix-blend-mode:multiply}.page-head p{margin:0 0 7px;color:var(--mute);font-size:13px;white-space:nowrap}
.spreads{display:grid;gap:96px}.spread{position:relative;display:grid;grid-template-columns:65% 35%;height:min(86vh,640px);min-height:520px;background:var(--paper);overflow:hidden}.spread::after{content:'';position:absolute;z-index:4;left:65%;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none}
.left-page{min-width:0;display:grid;grid-template-rows:14% 190px minmax(0,1fr);background:var(--paper)}.spread-top{display:flex;justify-content:space-between;gap:22px;align-items:flex-start;padding:24px 40px 12px}.spread-id{display:flex;gap:18px;align-items:baseline;min-width:0}.spread-id strong{font-size:15px;line-height:1.5}.spread-meta{max-width:52%;color:var(--mute);text-align:right;line-height:1.6}
.film-strip{display:flex;gap:6px;min-width:0;overflow-x:auto;overflow-y:hidden;background:#111;padding:10px 0;scrollbar-width:none}.film-strip::-webkit-scrollbar{display:none}.film-shot{position:relative;flex:0 0 auto;height:100%;min-width:96px;overflow:hidden;border:0;background:#292929;padding:0;color:#fff;cursor:zoom-in;scroll-snap-align:start}.film-shot img{display:block;width:auto;height:100%;min-width:96px;object-fit:cover;transition:transform .3s}.film-shot:hover img{transform:scale(1.04)}.film-shot.missing{width:112px;cursor:default}.film-shot.missing img{display:none}.shot-number{position:absolute;right:5px;bottom:4px;color:#fff;font:8px 'DM Mono',monospace;letter-spacing:.08em}.media-placeholder{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:8px;background:var(--placeholder);color:var(--mute);font:9px 'DM Mono',monospace;text-align:center;word-break:break-word}.missing>.media-placeholder{display:flex}
.spread:nth-child(2) .film-strip{gap:11px;margin-top:15px;padding:0 0 0 14px}
.spread-copy{min-height:0;padding:28px 40px 26px;overflow:hidden}.spread-copy p{max-width:28em;max-height:9.5em;overflow:hidden;margin:0;font-size:15px;line-height:1.9}.spread:nth-child(2) .spread-copy p{max-width:none}.spread-copy.has-certificate{display:grid;grid-template-columns:minmax(0,1fr) minmax(138px,28%);gap:30px;align-items:start;padding-top:22px}.copy-sections{display:grid;gap:14px;min-width:0}.copy-section-label{display:block;margin-bottom:4px;color:var(--mute);font:10px 'DM Mono',monospace;letter-spacing:.12em}.spread-copy.has-certificate p{max-width:none;max-height:none;font-size:13px;line-height:1.75}.certificate-figure{margin:0}.certificate-trigger{position:relative;width:100%;aspect-ratio:595.68/842.16;overflow:hidden;border:1px solid var(--line);background:var(--placeholder);padding:0;color:var(--mute);cursor:zoom-in}.certificate-trigger img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}.certificate-trigger.missing{cursor:default}.certificate-trigger.missing img{display:none}.certificate-caption{display:block;margin-top:7px;color:var(--mute);font:9px 'DM Mono',monospace;line-height:1.5;text-align:center}.note{display:block;width:auto;max-width:60%;max-height:92px;margin-top:18px;object-fit:contain;object-position:left center}
.main-photo{position:relative;min-width:0;height:100%;overflow:hidden;border:0;background:var(--paper);padding:0;color:var(--mute);cursor:zoom-in;opacity:0;transform:translateY(8px)}.main-photo.is-visible{animation:main-in .6s ease forwards}.main-photo img{display:block;width:100%;height:100%;object-fit:contain}.main-photo.missing{cursor:default;background:var(--placeholder)}.main-photo.missing img{display:none}@keyframes main-in{to{opacity:1;transform:none}}
.lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.96);padding:4vw}.lightbox.open{display:flex}.lightbox img{display:block;max-width:92vw;max-height:92vh;object-fit:contain}.lightbox-placeholder{display:none;align-items:center;justify-content:center;width:min(80vw,480px);aspect-ratio:4/3;background:#292929;color:#aaa;text-align:center}.lightbox.is-missing img{display:none}.lightbox.is-missing .lightbox-placeholder{display:flex}.lightbox-control{position:absolute;top:50%;display:grid;place-items:center;width:44px;height:44px;border:1px solid #777;border-radius:50%;background:#111;color:#fff;font-size:21px;cursor:pointer;transform:translateY(-50%)}.lightbox-control.prev{left:18px}.lightbox-control.next{right:18px}.lightbox-count{position:absolute;right:24px;bottom:20px;color:#fff}.lightbox-close{position:absolute;right:22px;top:18px;border:0;background:transparent;color:#fff;font-size:27px;cursor:pointer}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.main-photo{opacity:1;transform:none}.main-photo.is-visible{animation:none}.film-shot img{transition:none}}
@media(max-width:899px){.page{width:88vw;padding-top:18px}.page-head{display:block;padding:44px 0}.page-head h1{width:100%}.page-head p{margin:14px 0 0}.spreads{gap:72px}.spread{display:flex;flex-direction:column;height:auto;min-height:0;overflow:visible;background:transparent}.spread::after{display:none}.left-page{display:contents}.main-photo{order:1;width:100%;height:auto;aspect-ratio:3/4}.film-strip{order:2;height:116px;padding:10px 0;scroll-snap-type:x mandatory}.spread:nth-child(2) .film-strip{gap:10px;margin-top:0;padding:10px 0}.film-shot{height:96px;min-width:96px}.film-shot img{min-width:96px}.film-shot.missing{width:96px}.spread-top{order:3;padding:20px 0 12px}.spread-copy{order:4;padding:8px 0 0;overflow:visible}.spread-copy.has-certificate{display:grid;grid-template-columns:1fr;gap:22px;padding-top:8px}.spread-copy p{max-height:none}.spread-copy.has-certificate p{font-size:14px}.certificate-figure{width:min(72vw,300px);margin:0 auto}.note{max-height:82px}.lightbox{padding:64px 10px}.lightbox-control{top:auto;bottom:14px;transform:none}.lightbox-control.prev{left:calc(50% - 54px)}.lightbox-control.next{right:calc(50% - 54px)}.lightbox-count{right:16px;bottom:25px}.lightbox-close{right:12px;top:12px}}
</style>
</head>
<body>
<main class="page">
  <nav class="nav mono" aria-label="页面导航"><a href="index.html?view=works#works">← 返回作品</a><span>03 / 04</span></nav>
  <header class="page-head"><h1><img src="assets/titles/photography-works.png" alt="Photography works"></h1><p class="mono">个人摄影作品</p></header>
  <div class="spreads" id="spreads"></div>
  <footer class="project-footer"><a class="bottom-back mono" href="index.html?view=projects#projects">← 返回项目</a></footer>
</main>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片预览" aria-hidden="true"><button class="lightbox-close" type="button" aria-label="关闭">×</button><button class="lightbox-control prev" type="button" aria-label="上一张">←</button><img alt=""><span class="lightbox-placeholder mono"></span><button class="lightbox-control next" type="button" aria-label="下一张">→</button><span class="lightbox-count mono"></span></div>
<script>
const groups=[
  {title:'戏韵川魂（人文纪实摄影）',meta:'2025 · 四川成都 · 索尼a7m4',concept:'走近川剧后台，捕捉老师们在候场、交谈、整理妆造时自然松弛的状态，记录舞台之外真实而鲜活的一面。通过人物神态、妆造细节与光影的结合，呈现传统戏曲中不被看见的另一种美。',result:'课程摄影作业，参加未来设计师全国高校数字艺术设计大赛，获四川省二等奖。',certificate:'assets/work-photo/g1/certificate.png',main:'assets/work-photo/g1/main.jpg',shots:['assets/work-photo/g1/s1.jpg','assets/work-photo/g1/s2.jpg','assets/work-photo/g1/s3.jpg','assets/work-photo/g1/s4.jpg','assets/work-photo/g1/s5.jpg']},
  {title:'阆中遗梦（古建筑摄影）',meta:'2025 · 四川南充 · 索尼a7m4',text:'我试图跳出古城常规的风光记录，以个人视角捕捉红墙、古树与光影交织的瞬间，用镜头呈现我眼中阆中古城的秋日诗意与时间感。',main:'assets/work-photo/g2/main.jpg',shots:['assets/work-photo/g2/s2.jpg','assets/work-photo/g2/s3.jpg','assets/work-photo/g2/s5.jpg']}
];
const esc=function(value){return String(value).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
const fileName=function(path){return path.split('/').pop()};
const spreads=document.getElementById('spreads');
spreads.innerHTML=groups.map(function(group,groupIndex){const number=String(groupIndex+1).padStart(2,'0');const total=String(groups.length).padStart(2,'0');const shots=group.shots.map(function(src,shotIndex){return '<button class="film-shot photo-trigger" type="button" data-group="'+groupIndex+'" data-photo="'+(shotIndex+1)+'" aria-label="查看第 '+(shotIndex+1)+' 张底片"><img src="'+esc(src)+'" alt="第 '+(shotIndex+1)+' 张底片" onerror="this.parentElement.classList.add(\'missing\');this.remove()"><span class="media-placeholder">'+esc(fileName(src))+'</span><span class="shot-number">'+String(shotIndex+1).padStart(2,'0')+'</span></button>'}).join('');const copy=group.certificate?'<div class="spread-copy has-certificate"><div class="copy-sections"><section><span class="copy-section-label">创作理念</span><p>'+esc(group.concept)+'</p></section><section><span class="copy-section-label">作品成果</span><p>'+esc(group.result)+'</p></section></div><figure class="certificate-figure"><button class="certificate-trigger photo-trigger" type="button" data-group="'+groupIndex+'" data-photo="'+(group.shots.length+1)+'" aria-label="查看获奖证书"><img src="'+esc(group.certificate)+'" alt="未来设计师全国高校数字艺术设计大赛四川省二等奖证书" onerror="this.parentElement.classList.add(\'missing\');this.remove()"><span class="media-placeholder">'+esc(fileName(group.certificate))+'</span></button><figcaption class="certificate-caption">获奖证书 · 点击放大</figcaption></figure></div>':'<div class="spread-copy"><span class="copy-section-label">创作理念</span><p>'+esc(group.text)+'</p></div>';return '<article class="spread"><div class="left-page"><header class="spread-top"><div class="spread-id"><span class="mono">'+number+' / '+total+'</span><strong>'+esc(group.title)+'</strong></div><span class="spread-meta mono">'+esc(group.meta)+'</span></header><div class="film-strip">'+shots+'</div>'+copy+'</div><button class="main-photo photo-trigger" type="button" data-group="'+groupIndex+'" data-photo="0" aria-label="查看'+esc(group.title)+'主图"><img src="'+esc(group.main)+'" alt="'+esc(group.title)+'主图" onerror="this.parentElement.classList.add(\'missing\');this.remove()"><span class="media-placeholder">'+esc(fileName(group.main))+'</span></button></article>'}).join('');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;const mainPhotos=[].slice.call(document.querySelectorAll('.main-photo'));
if(reduceMotion){mainPhotos.forEach(function(photo){photo.style.opacity='1';photo.style.transform='none'})}else{const observer=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target)}})},{threshold:.2});mainPhotos.forEach(function(photo){observer.observe(photo)})}
const lightbox=document.getElementById('lightbox'),lightboxImage=lightbox.querySelector('img'),lightboxPlaceholder=lightbox.querySelector('.lightbox-placeholder'),count=lightbox.querySelector('.lightbox-count');let activeGroup=0,activePhoto=0,lastTrigger=null;
const groupPhotos=function(groupIndex){const group=groups[groupIndex];return [group.main].concat(group.shots,group.certificate?[group.certificate]:[])};
function showPhoto(groupIndex,photoIndex){const photos=groupPhotos(groupIndex);activeGroup=groupIndex;activePhoto=(photoIndex+photos.length)%photos.length;lightbox.classList.remove('is-missing');lightboxImage.src=photos[activePhoto];lightboxImage.alt=groups[groupIndex].title+' '+(activePhoto+1);lightboxPlaceholder.textContent=fileName(photos[activePhoto]);count.textContent=(activePhoto+1)+' / '+photos.length;lightbox.classList.add('open');lightbox.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';lightbox.querySelector('.lightbox-close').focus()}
function closeLightbox(){lightbox.classList.remove('open','is-missing');lightbox.setAttribute('aria-hidden','true');lightboxImage.removeAttribute('src');document.body.style.overflow='';if(lastTrigger)lastTrigger.focus()}
document.addEventListener('click',function(event){const trigger=event.target.closest('.photo-trigger');if(!trigger||trigger.classList.contains('missing'))return;lastTrigger=trigger;showPhoto(Number(trigger.dataset.group),Number(trigger.dataset.photo))});
lightbox.addEventListener('click',function(event){if(event.target===lightbox||event.target===lightboxImage)closeLightbox()});lightbox.querySelector('.lightbox-close').addEventListener('click',closeLightbox);lightbox.querySelector('.prev').addEventListener('click',function(){showPhoto(activeGroup,activePhoto-1)});lightbox.querySelector('.next').addEventListener('click',function(){showPhoto(activeGroup,activePhoto+1)});
lightboxImage.addEventListener('load',function(){lightbox.classList.remove('is-missing')});lightboxImage.addEventListener('error',function(){lightbox.classList.add('is-missing')});
addEventListener('keydown',function(event){if(!lightbox.classList.contains('open'))return;if(event.key==='Escape')closeLightbox();if(event.key==='ArrowLeft')showPhoto(activeGroup,activePhoto-1);if(event.key==='ArrowRight')showPhoto(activeGroup,activePhoto+1)});
</script>
</body>
</html>
