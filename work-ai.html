<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 短片 — Siqi's Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&amp;family=Noto+Serif+SC:wght@400;700&amp;display=swap" rel="stylesheet">
<link href="media-viewer.css" rel="stylesheet">
<style>
:root{--work-bg:#111;--work-panel:#111;--work-text:#F7F5F8;--work-mute:#A9A3AF;--work-line:#2A2A2A;box-sizing:border-box}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;overflow-x:hidden;background:var(--work-bg);color:var(--work-text);font-family:'Noto Serif SC',serif}.mono{font:11px 'DM Mono',monospace;letter-spacing:.12em}.works{width:100%}.work{padding-bottom:120px;background:var(--work-panel)}.work+.work{padding-top:120px;border-top:1px solid var(--work-line)}
.hero{position:relative;min-height:75vh;overflow:hidden;isolation:isolate}.hero-media,.hero-mask{position:absolute;inset:0}.hero-media{z-index:-2;background:#1B1B1B}.hero-media video,.hero-media img{width:100%;height:100%;display:block;object-fit:cover}.hero-media img{display:none}.hero-media.missing video,.hero-media.missing img{display:none}.hero-media.reduced video{display:none}.hero-media.reduced img{display:block}.hero-mask{z-index:-1;background:linear-gradient(to bottom,rgba(17,17,17,.14) 0%,rgba(17,17,17,.46) 46%,var(--work-bg) 100%)}.placeholder{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:#1B1B1B;color:var(--work-mute);text-align:center;word-break:break-word}.missing>.placeholder{display:flex}
.work:first-child .hero{padding-top:114px}.work:nth-child(2) .hero{padding-top:1px}
.hero-inner{width:min(1080px,88vw);min-height:75vh;margin:0 auto;padding:104px 0 34px;display:flex;flex-direction:column;justify-content:flex-end}.hero-nav{position:absolute;left:6vw;right:6vw;top:28px;display:flex;justify-content:space-between;align-items:center}.hero-nav a,.bottom-back{color:var(--work-text);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:3px}.hero-title{max-width:12ch;margin:0;font-size:clamp(52px,7.5vw,112px);line-height:.98;letter-spacing:.06em;text-transform:uppercase}.work:first-child .hero-title,.work:nth-child(2) .hero-title{font-size:clamp(40px,4.25vw,52.1px)}.meta{margin:15px 0 38px;color:var(--work-text)}.hero-info{display:grid;grid-template-columns:138px minmax(0,1fr);gap:28px;align-items:end}.poster{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:10px;background:#1B1B1B}.poster img{width:100%;height:100%;display:block;object-fit:cover}.poster.missing img{display:none}.details{min-width:0}.detail-columns{display:grid;grid-template-columns:1fr 1fr;gap:42px}.detail-block .label,.note-label{display:block;margin-bottom:9px;color:var(--work-mute)}.detail-block p{max-width:46ch;margin:0;line-height:1.75;white-space:pre-line}.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.pill{min-width:96px;border:1px solid var(--work-text);border-radius:999px;padding:7px 14px;color:var(--work-text);text-align:center}
.gallery-label{padding:30px 0 18px;text-align:center;color:var(--work-text)}.gallery-label span{display:block;margin-top:4px;font-size:17px}.lower{width:min(1080px,92vw);margin:0 auto;display:grid;grid-template-columns:minmax(0,2.3fr) minmax(230px,.7fr);gap:48px;align-items:start}.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.shot{min-width:0;margin:0}.shot-frame{position:relative;aspect-ratio:16/9;overflow:hidden;border:0;border-radius:2px;background:#1B1B1B;padding:0;width:100%;cursor:zoom-in;color:var(--work-mute)}.shot-frame img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .4s}.shot-frame:not(.missing):hover img{transform:scale(1.03)}.shot-frame.missing{cursor:default}.shot-frame.missing img{display:none}.shot figcaption{margin-top:7px;color:var(--work-mute);font-size:10px;line-height:1.5}.notes{position:sticky;top:96px}.notes h2{margin:0 0 22px;font-size:clamp(25px,2.6vw,38px)}.note{padding:15px 0;border-top:1px solid var(--work-line)}.note p{margin:0;font-size:14px;line-height:1.75}.bottom{width:min(1080px,88vw);margin:0 auto;padding:40px 0 72px}
.lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.94);padding:5vw}.lightbox.open{display:flex}.lightbox img{display:block;max-width:90vw;max-height:88vh;object-fit:contain}.lightbox button{position:absolute;top:50%;width:44px;height:44px;border:1px solid var(--work-line);background:var(--work-bg);color:var(--work-text);font-size:25px;cursor:pointer}.lightbox .prev{left:18px}.lightbox .next{right:18px}
.work:nth-child(2) .detail-block:first-child p{font-size:14px}
@media(max-width:899px){.work{padding-bottom:80px}.work+.work{padding-top:80px}.hero{min-height:60vh}.work:first-child .hero{padding-top:64px}.work:nth-child(2) .hero{padding-top:56px}.hero-inner{min-height:60vh;padding-top:84px}.hero-nav{left:6vw;right:6vw;top:22px}.hero-title{font-size:clamp(38px,12vw,62px)}.hero-info{grid-template-columns:1fr;gap:18px}.poster{width:130px}.detail-columns{grid-template-columns:1fr;gap:18px}.lower{grid-template-columns:1fr;gap:48px;width:88vw}.shots{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.notes{position:static}.gallery-label{padding:28px 0 20px}.lightbox{padding:64px 12px}.lightbox button{top:auto;bottom:12px}.lightbox .prev{left:calc(50% - 54px)}.lightbox .next{right:calc(50% - 54px)}}
.work:nth-child(2){padding-top:0;padding-bottom:0}
.more-ai-works{width:min(900px,88vw);margin:0 auto;padding:76px 0 36px;border-top:1px solid var(--work-line)}.more-works-heading{display:grid;gap:8px}.more-works-kicker{color:var(--work-mute)}.more-works-heading strong{font-size:clamp(24px,3vw,38px);font-weight:400}.practice-layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(240px,.8fr);gap:38px;align-items:start;padding-top:30px}.practice-case{min-width:0;margin:0}.practice-video-frame{display:grid;place-items:center;min-height:280px;overflow:hidden;border:1px solid var(--work-line);background:#090909}.practice-video-frame video{display:block;width:100%;max-height:58vh;object-fit:contain;background:#090909}.practice-notes h2{margin:0 0 22px;font-size:clamp(25px,2.6vw,38px)}.practice-note{padding:15px 0;border-top:1px solid var(--work-line)}.practice-note p{margin:0;color:var(--work-text);font-size:14px;line-height:1.75}
@media(max-width:899px){.more-ai-works{padding:54px 0 20px}.practice-layout{grid-template-columns:1fr;gap:38px;padding-top:28px}.practice-video-frame{min-height:0}.practice-video-frame video{max-height:70vh}}
</style>
</head>
<body>
<main id="works" class="works"></main>
<section class="more-ai-works" id="more-ai-works">
  <header class="more-works-heading"><span class="more-works-kicker mono">MORE AI WORKS</span><strong>日常 AI 练习案例</strong></header>
  <div class="practice-layout">
    <figure class="practice-case"><div class="practice-video-frame"><video controls playsinline preload="metadata" aria-label="日常 AI 练习案例视频"><source src="assets/work-ai/daily-practice.mp4" type="video/mp4">当前浏览器不支持视频播放。</video></div></figure>
    <aside class="practice-notes"><h2>创作手记</h2><div class="practice-note"><span class="note-label mono">创作说明</span><p>以真实影视片段为参考，从演员微表情与情绪表达、灯光层次、镜头构图及场景氛围等维度进行拉片分析，将影像语言转化为提示词，并使用可灵进行 AI 视频复刻与创作。</p></div><div class="practice-note"><span class="note-label mono">学习收获</span><p>创作难点在于人物眼泪的真实呈现。初期生成的泪水质感僵硬，像胶水一样缺乏真实的生理状态。通过反复调整提示词，进一步练习ai细微情绪表达与真实影像质感。</p></div></aside>
  </div>
</section>
<footer class="bottom"><a class="bottom-back mono" href="index.html?view=works#works">← 返回作品</a></footer>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="分镜图片预览"><button class="prev" type="button" aria-label="上一张">‹</button><img alt=""><button class="next" type="button" aria-label="下一张">›</button></div>
<script>
const works=[1,2].map(function(n){return{
  title:n===1?'SNOW ECHO':'The Kick, Awesome!',year:'[待填]',duration:'[待填]',ratio:'[待填]',meta:n===1?['AI短片','仿纪录片','川西高原','人文影像']:['蒙牛动画赛道','AI短片','3D动画','品牌创意'],intro:n===1?'以川西高原为背景，仿纪录片的影像语言，记录藏族地区的日常生活与人文风貌。通过 AI 生成影像还原具有地域特色的生活切片。\n这不仅是一次对地域文化的视觉探索，也是一次关于 AI 影像叙事与纪实美学的创作尝试。':'本作品为参加「中国好创意」全国数字艺术设计大赛·蒙牛动画赛道的 AI 创意短片。\n\n以足球比赛为故事背景，讲述三位少年在赛场上接连受挫，在蒙牛小精灵的力量加持下，重新找回信心并逆转比赛的故事。\n\n将品牌元素融入少年热血的体育叙事，探索 AI 动画在品牌创意表达中的应用。',style:n===1?'人文胶片纪实感':'3D卡通动画',tags:[n===1?'仿纪录片':'电影感光影'],
  notes:n===1?[{label:'难点',text:'AI 生成画面出现过度平滑的皮肤、失真的人物细节和过于鲜艳饱和的色彩，整体呈现出一种不真实的完美感'},{label:'参考类型',text:'川西人文摄影、自然风光摄影、纪实摄影作品'},{label:'使用工具',text:'ChatGPT、可灵'},{label:'画面是怎么生成的',text:'我去寻找川西的优秀摄影作品，用真实作品倒推关键提示词，保留摄影作品留下的粗糙感和不完美点去生图。'}]:[{label:'难点',text:'AI 生成的皮克斯风格人物容易陷入同质化审美：大眼睛、标准化五官、过度精致的面部，缺乏角色辨识度。'},{label:'参考类型',text:'皮克斯风格'},{label:'使用工具',text:'chat gpt 可灵、即梦'},{label:'画面是怎么生成的',text:'我在生图是保留三个关键句：删掉最常见的30%元素。选择一个特点刻意强化，建立角色辨识度。保留不完美。 生视频时，我参考真实足球运动员的动作让ai来给我复刻一系列姿势。'}],
  shots:(n===1?['赛马节','祈福','锅庄舞','锅庄舞','捻羊毛','藏区小孩儿']:['人物角色版','对手设定','阿力个人高光分镜','','','']).map(function(caption,i){return{src:'assets/work-ai/w'+n+'/shot-'+(i+1)+'.jpg',caption:caption}}),
  hero:'assets/work-ai/w'+n+'/hero.mp4',heroType:'video/mp4',heroPoster:'assets/work-ai/w'+n+'/hero-poster.jpg',poster:'assets/work-ai/w'+n+'/poster.jpg'
}});
const root=document.getElementById('works');
const esc=function(value){return String(value).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
root.innerHTML=works.map(function(work,index){
  const number=String(index+1).padStart(2,'0');
  const total=String(works.length).padStart(2,'0');
  const shots=work.shots.map(function(shot,shotIndex){return '<figure class="shot"><button class="shot-frame" type="button" data-work="'+index+'" data-shot="'+shotIndex+'" aria-label="查看分镜 '+(shotIndex+1)+'"><img src="'+esc(shot.src)+'" alt="分镜 '+(shotIndex+1)+'" onerror="this.parentElement.classList.add(\'missing\');this.remove()"><span class="placeholder mono">'+esc(shot.src.split('/').pop())+'</span></button>'+(shot.caption?'<figcaption>'+esc(shot.caption)+'</figcaption>':'')+'</figure>'}).join('');
  const notes=work.notes.map(function(note){return '<div class="note"><span class="note-label mono">'+esc(note.label)+'</span><p>'+esc(note.text)+'</p></div>'}).join('');
  const tags=work.tags.map(function(tag){return '<span class="pill mono">'+esc(tag)+'</span>'}).join('');
  return '<article class="work" data-work="'+index+'"><section class="hero"><div class="hero-media"><video autoplay muted loop playsinline preload="metadata" poster="'+esc(work.heroPoster)+'" onerror="this.parentElement.classList.add(\'missing\')"><source src="'+esc(work.hero)+'" type="'+esc(work.heroType)+'" onerror="this.parentElement.parentElement.classList.add(\'missing\')"></video><img src="'+esc(work.heroPoster)+'" alt="" onerror="this.parentElement.classList.add(\'missing\');this.remove()"><span class="placeholder mono">'+esc(work.hero.split('/').pop())+'</span></div><div class="hero-mask"></div><nav class="hero-nav mono"><a href="index.html?view=works#works">← 返回作品</a><span>'+number+' / '+total+'</span></nav><div class="hero-inner"><h1 class="hero-title">'+esc(work.title)+'</h1><p class="meta mono">'+work.meta.map(esc).join(' &nbsp;|&nbsp; ')+'</p><div class="hero-info"><div class="poster"><img src="'+esc(work.poster)+'" alt="作品海报" onerror="this.parentElement.classList.add(\'missing\');this.remove()"><span class="placeholder mono">'+esc(work.poster.split('/').pop())+'</span></div><div class="details"><div class="detail-columns"><div class="detail-block"><span class="label mono">短片介绍</span><p>'+esc(work.intro)+'</p></div><div class="detail-block"><span class="label mono">风格</span><p>'+esc(work.style)+'</p></div></div><div class="pills">'+tags+'</div></div></div></div></section><div class="gallery-label mono">GALLERY<span>↓</span></div><div class="lower"><div class="shots">'+shots+'</div><aside class="notes"><h2>创作手记</h2>'+notes+'</aside></div></article>'
}).join('');

const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const videos=[].slice.call(document.querySelectorAll('.hero-media video'));
videos.forEach(function(video){video.pause()});
if(reduceMotion){videos.forEach(function(video){video.autoplay=false;video.removeAttribute('autoplay')});document.querySelectorAll('.hero-media').forEach(function(media){media.classList.add('reduced')})}else{
  const observer=new IntersectionObserver(function(entries){entries.forEach(function(entry){const video=entry.target.querySelector('video');if(!video)return;if(entry.isIntersecting){video.play().catch(function(){})}else{video.pause()}})},{threshold:.25});
  document.querySelectorAll('.hero').forEach(function(hero){observer.observe(hero)});
}

const lightbox=document.getElementById('lightbox'),lightboxImage=lightbox.querySelector('img');let activeWork=0,activeShot=0;
function showShot(workIndex,shotIndex){const shot=works[workIndex].shots[shotIndex];activeWork=workIndex;activeShot=shotIndex;lightboxImage.src=shot.src;lightboxImage.alt=shot.caption||'分镜图片';lightbox.classList.add('open');document.body.style.overflow='hidden'}
function closeLightbox(){lightbox.classList.remove('open');lightboxImage.removeAttribute('src');document.body.style.overflow=''}
document.querySelectorAll('.shot-frame').forEach(function(button){button.addEventListener('click',function(){if(button.classList.contains('missing'))return;showShot(Number(button.dataset.work),Number(button.dataset.shot))})});
lightbox.addEventListener('click',function(event){if(event.target===lightbox||event.target===lightboxImage)closeLightbox()});
lightbox.querySelector('.prev').addEventListener('click',function(){showShot(activeWork,(activeShot+works[activeWork].shots.length-1)%works[activeWork].shots.length)});
lightbox.querySelector('.next').addEventListener('click',function(){showShot(activeWork,(activeShot+1)%works[activeWork].shots.length)});
addEventListener('keydown',function(event){if(!lightbox.classList.contains('open'))return;if(event.key==='Escape')closeLightbox();if(event.key==='ArrowLeft')lightbox.querySelector('.prev').click();if(event.key==='ArrowRight')lightbox.querySelector('.next').click()});
</script>
<script src="media-viewer.js"></script>
</body>
</html>
